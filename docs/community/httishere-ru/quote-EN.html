<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Цитата</title>
  <script src="./global.js"></script><script src="./i18n.js?rev=20261106-2"></script>
  <script src="./crypto-js.min.js"></script>
  <style>
    body,
    html {
      background-color: #ffffff;
      margin: 0;
      padding: 0;
    }

    @font-face {
      font-family: 'IndieFlower';
      src: url("https://httishere.github.io/notion-widget/fonts/Indie_Flower/IndieFlower-Regular.ttf");
    }

    .quote-box {
      width: 100%;
      margin: 0 auto;
      height: 100vh;
      background: #ffffff;
      box-sizing: border-box;
      padding: 40px
    }

    .icon {
      position: absolute;
    }

    .icon.icon-top {
      top: -30px;
      left: -30px;
    }

    .icon.icon-bottom {
      bottom: -30px;
      right: -20px;
      transform: rotate(180deg);
    }

    .quote-box__inner {
      font-size: 18px;
      position: relative;
      line-height: 1.8;
    }

    #text {
      font-family: 'IndieFlower';
      font-size: 22px;
      margin: 0;
      box-sizing: border-box;
      padding: 5px 20px;
    }

    html[theme="dark"],
    html[theme="dark"] body,
    html[theme="dark"] .quote-box {
      background-color: #191919;
      color: #ffffff;
    }
  </style>
<style>html,body{max-width:100%;overflow-x:hidden}*{box-sizing:border-box}#text{overflow-wrap:anywhere}#watermark{font-family:system-ui,sans-serif} .container{max-width:100%} .inner{min-width:0}</style><style>.quote-box{height:auto;min-height:0;padding:clamp(18px,5vw,40px)}.quote-box__inner{width:100%;letter-spacing:normal!important}#text{font-size:clamp(12px,4.4vw,22px);line-height:1.45;letter-spacing:normal!important;white-space:normal;overflow-wrap:break-word;word-break:normal} .icon.icon-top{top:-15px;left:-15px}.icon.icon-bottom{bottom:-15px;right:-10px}#text{padding:5px 10px}</style></head>

<body>
  <div class="quote-box" id="quote-box">
    <div class="quote-box__inner">
      <img class="icon icon-top" src="https://img.icons8.com/doodle/48/000000/quote-left.png" />
      <p id="text"></p>
      <img class="icon icon-bottom" src="https://img.icons8.com/doodle/48/000000/quote-left.png" />
    </div>
  </div>
</body>
<script>
  const params = getAllParams(CryptoJS);
  handleDarkMode(params);
  window.onload = function () {
    let _quote_content =
      getQueryString("text") || params.content || "HTTISHERE";
    document.getElementById("text").innerHTML = _quote_content;
    document.getElementById("quote-box").style.color = params.font_color;
  };
</script>

</html>
