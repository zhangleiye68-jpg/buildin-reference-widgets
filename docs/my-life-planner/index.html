<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Планер моей жизни — интерактивные виджеты</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { padding: 34px; background: #f4f7f0; }
    header { max-width: 1180px; margin: 0 auto 28px; }
    h1 { margin: 0; font: 700 44px/1.08 Georgia, serif; }
    p { color: var(--muted); }
    .cover-frame { width: 100%; height: 300px; border: 0; border-radius: 26px; box-shadow: var(--shadow); }
    .grid { max-width: 1180px; margin: 24px auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start; }
    article { padding: 18px; border-radius: 28px; background: rgba(255,255,255,.78); }
    article h2 { margin: 0 0 13px; font: 700 23px/1.2 Georgia, serif; color: var(--burgundy); }
    iframe { width: 100%; border: 0; background: transparent; }
    .clock { height: 150px; }
    .counter { height: 310px; }
    .pomodoro { height: 650px; }
    .animal { height: 740px; }
    .music { height: 600px; }
    .plant { display: grid; place-items: center; min-height: 260px; }
    .plant img { width: min(90%, 360px); animation: breathe 3.2s ease-in-out infinite; transform-origin: 50% 82%; }
    @media (max-width: 820px) { body { padding: 18px; } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header><h1>планер моей жизни</h1><p>Интерактивные виджеты — живая демонстрация</p></header>
  <main>
    <div style="max-width:1180px;margin:auto"><iframe class="cover-frame" src="cover.html" title="Анимированная садовая обложка"></iframe></div>
    <section class="grid">
      <article><h2>Розовые перекидные часы</h2><iframe class="clock" src="clock.html" title="Перекидные часы"></iframe></article>
      <article><h2>Счётчик прочитанных книг</h2><iframe class="counter" src="counter.html" title="Счётчик книг"></iframe></article>
      <article><h2>Садовый таймер</h2><iframe class="pomodoro" src="pomodoro.html" title="Таймер фокусировки"></iframe></article>
      <article><h2>Уютная комната</h2><iframe class="animal" src="animal.html" title="Уютная комната"></iframe></article>
      <article><h2>Музыка для продуктивности</h2><iframe class="music" src="music.html" title="Музыкальный плеер"></iframe></article>
      <article><h2>Моё растение</h2><iframe class="counter" src="plant.html" title="Интерактивное растение"></iframe></article>
    </section>
  </main>
</body>
</html>
