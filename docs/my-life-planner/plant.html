<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Моё растение</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden}body{margin:0;min-height:100vh;display:grid;place-items:center;background:transparent;font-family:system-ui,sans-serif;color:#36513e}
    .card{position:relative;width:min(100%,520px);min-height:390px;overflow:hidden;border-radius:24px;padding:20px 24px 22px;background:linear-gradient(#eef8ed,#fff9ec);box-shadow:0 16px 40px #31523822;text-align:center}
    h1{margin:0;color:#477552;font:800 25px/1.2 Georgia,serif}.plant{position:relative;height:245px;display:grid;place-items:center}.plant img{width:min(90%,340px);max-height:230px;object-fit:contain;transform-origin:50% 82%;animation:breathe 3.2s ease-in-out infinite}.plant.watered img{animation:happy .8s ease-in-out 2}.drop{position:absolute;top:30px;color:#38a9dd;font-size:28px;animation:drop .8s ease-in forwards}.stats{margin:-4px 0 14px;font-weight:650}.water{border:0;border-radius:999px;padding:12px 24px;background:#6fac77;color:white;font-weight:800;cursor:pointer;box-shadow:0 7px 16px #47755230}.water:active{transform:translateY(2px)}
    @keyframes breathe{50%{transform:translateY(-5px) scale(1.015)}}@keyframes happy{25%{transform:rotate(-4deg) scale(1.04)}75%{transform:rotate(4deg) scale(1.04)}}@keyframes drop{from{opacity:0;transform:translateY(-22px)}30%{opacity:1}to{opacity:0;transform:translateY(145px)}}
    @media(max-width:420px){.card{height:100%;min-height:0;padding:17px 13px;border-radius:18px}h1{font-size:21px}.plant{height:235px}.plant img{max-height:215px}.stats{font-size:13px}.water{padding:11px 16px;font-size:13px}}
  </style>
</head>
<body>
  <main class="card"><h1>🪴 Моё растение</h1><div class="plant" id="plant"><img src="assets/pixel-plant.png" alt="Зелёное комнатное растение"></div><div class="stats" id="stats"></div><button class="water" id="water">💧 Полить растение</button></main>
  <script>
    const key='my-life-planner.plant-watered';let count=Math.max(0,Number(localStorage.getItem(key)||0));const plant=document.querySelector('#plant'),stats=document.querySelector('#stats');
    function draw(){stats.textContent=`Поливов сегодня: ${count}`;localStorage.setItem(key,String(count))}
    document.querySelector('#water').onclick=()=>{count++;draw();plant.classList.remove('watered');void plant.offsetWidth;plant.classList.add('watered');for(let i=0;i<4;i++){const drop=document.createElement('span');drop.className='drop';drop.textContent='💧';drop.style.left=`${35+i*10}%`;drop.style.animationDelay=`${i*.1}s`;plant.append(drop);setTimeout(()=>drop.remove(),1200)}};draw();
  </script>
</body>
</html>
