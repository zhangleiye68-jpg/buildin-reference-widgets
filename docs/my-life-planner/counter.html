<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Прочитанные книги</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden}body{margin:0;min-height:100vh;display:grid;place-items:center;background:transparent;font-family:Georgia,"Times New Roman",serif}
    .card{width:min(100%,520px);padding:32px 38px 28px;border-radius:22px;background:#f2c7d8;color:#211b1d}
    h1{margin:0 0 28px;color:#a80f4f;font-size:30px}.controls{display:grid;grid-template-columns:76px 1fr 76px;align-items:center;gap:18px}
    button{border:0;border-radius:14px;background:#faf8f5;min-height:68px;font-size:36px;color:#4b4846;cursor:pointer;box-shadow:0 6px 14px #b4779022}button:active{transform:translateY(2px)}
    output{text-align:center;font:800 48px/1 system-ui}.reset{display:block;margin:16px auto 0;background:none;box-shadow:none;min-height:0;padding:4px 12px;font:16px system-ui;color:#524a4e}
    @media(max-width:420px){.card{padding:25px 14px 22px;border-radius:18px}h1{margin-bottom:22px;font-size:24px;line-height:1.08}.controls{grid-template-columns:54px minmax(38px,1fr) 54px;gap:8px}button{min-height:54px;border-radius:11px;font-size:30px}output{font-size:42px}.reset{margin-top:13px;font-size:14px}}
  </style>
</head>
<body>
  <main class="card"><h1>▣&nbsp; Прочитанные книги</h1><div class="controls"><button id="minus" aria-label="Уменьшить на один">−</button><output id="count">10</output><button id="plus" aria-label="Увеличить на один">+</button></div><button class="reset" id="reset">сбросить</button></main>
  <script>
    const key='my-life-planner.books-read';const view=document.querySelector('#count');let count=Math.max(0,Number(localStorage.getItem(key)??10)||0);
    function draw(){view.value=count;view.textContent=count;localStorage.setItem(key,String(count))}
    document.querySelector('#plus').onclick=()=>{count++;draw()};document.querySelector('#minus').onclick=()=>{count=Math.max(0,count-1);draw()};document.querySelector('#reset').onclick=()=>{count=0;draw()};draw();
  </script>
</body>
</html>
