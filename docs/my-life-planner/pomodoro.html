<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Садовый таймер фокусировки</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden}body{margin:0;min-height:100vh;display:grid;place-items:center;background:transparent;font-family:system-ui,sans-serif}
    .card{position:relative;width:min(100%,520px);aspect-ratio:4/5.2;overflow:hidden;border-radius:24px;background:#159bad url('assets/cover-garden.png') center/cover;color:white;box-shadow:0 18px 45px #17514b33}
    .card::before{content:"";position:absolute;inset:0;background:#058fa233}.content{position:relative;height:100%;padding:30px 28px;display:flex;flex-direction:column;align-items:center}
    .modes{display:grid;gap:12px;width:260px}.mode{border:2px solid white;border-radius:999px;padding:10px 18px;background:#0c96a8aa;color:white;font-weight:700;cursor:pointer}.mode.active{background:#fff;color:#242424}
    time{margin:auto;font-size:96px;font-weight:800;letter-spacing:-5px;text-shadow:0 5px 20px #17474b44}.bottom{display:grid;grid-template-columns:1fr 54px 54px;gap:12px;width:100%;align-items:center}
    .start{border:0;border-radius:999px;padding:15px;background:white;color:#222;font-weight:800;font-size:19px;cursor:pointer}.icon{border:0;background:#ffffff18;color:white;border-radius:50%;width:50px;height:50px;font-size:28px;cursor:pointer}
    dialog{border:0;border-radius:20px;padding:24px;background:#fffdf9;color:#24302b;box-shadow:0 24px 70px #1238;width:min(92vw,390px)}dialog::backdrop{background:#1238;backdrop-filter:blur(4px)}dialog h2{margin:0 0 18px;color:#8f2851}label{display:grid;grid-template-columns:1fr 90px;gap:16px;align-items:center;margin:12px 0;font-weight:650}input{width:90px;padding:9px 10px;border:1px solid #d9c9cf;border-radius:10px}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.dialog-actions button{border:0;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer}.save{background:#1197a7;color:white}.cancel{background:#eee8e9;color:#493d41}
    @media(max-width:420px){.card{height:100%;aspect-ratio:auto;border-radius:18px}.content{padding:19px 14px}.modes{width:100%;gap:8px}.mode{padding:8px 9px;font-size:13px}time{font-size:66px;letter-spacing:-3px}.bottom{grid-template-columns:minmax(0,1fr) 42px 42px;gap:8px}.start{padding:12px 8px;font-size:16px}.icon{width:42px;height:42px;font-size:23px}dialog{padding:18px}dialog h2{font-size:20px}label{grid-template-columns:1fr 72px;gap:8px;font-size:13px}input{width:72px}}
  </style>
</head>
<body>
  <main class="card"><div class="content"><div class="modes"><button class="mode active" data-kind="focus" data-minutes="25">фокус</button><button class="mode" data-kind="short" data-minutes="5">короткий перерыв</button><button class="mode" data-kind="long" data-minutes="15">длинный перерыв</button></div><time id="time">25:00</time><div class="bottom"><button class="start" id="start">начать</button><button class="icon" id="reset" aria-label="Сбросить таймер">↻</button><button class="icon" id="settings" aria-label="Настройки таймера">⚙</button></div></div></main>
  <dialog id="settingsDialog"><form method="dialog"><h2>Настройки таймера</h2><label>Фокус, минут <input id="focusMinutes" type="number" min="1" max="120" value="25"></label><label>Короткий перерыв <input id="shortMinutes" type="number" min="1" max="60" value="5"></label><label>Длинный перерыв <input id="longMinutes" type="number" min="1" max="90" value="15"></label><div class="dialog-actions"><button class="cancel" value="cancel">Отмена</button><button class="save" id="saveSettings" value="default">Сохранить</button></div></form></dialog>
  <script>
    const defaults={focus:25,short:5,long:15};const saved=JSON.parse(localStorage.getItem('my-life-planner.timer-settings')||'null')||defaults;let settings={...defaults,...saved};let activeKind='focus';let duration=settings.focus*60,remaining=duration,running=false,lastTick=0,timer=null;const view=document.querySelector('#time'),start=document.querySelector('#start');
    const format=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
    function draw(){view.textContent=format(remaining);start.textContent=running?'пауза':'начать';document.title=`${format(remaining)} — ${running?'фокус':'таймер'}`}
    function stop(){running=false;clearInterval(timer);timer=null;draw()}
    function begin(){running=true;lastTick=Date.now();timer=setInterval(()=>{const now=Date.now();const elapsed=Math.floor((now-lastTick)/1000);if(elapsed>0){remaining=Math.max(0,remaining-elapsed);lastTick+=elapsed*1000;draw();if(!remaining)stop()}},250);draw()}
    start.onclick=()=>running?stop():begin();document.querySelector('#reset').onclick=()=>{stop();remaining=duration;draw()};
    function refreshModes(){document.querySelectorAll('.mode').forEach(button=>{button.dataset.minutes=settings[button.dataset.kind]})}
    document.querySelectorAll('.mode').forEach(button=>button.onclick=()=>{stop();document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));button.classList.add('active');activeKind=button.dataset.kind;duration=settings[activeKind]*60;remaining=duration;draw()});
    const dialog=document.querySelector('#settingsDialog');document.querySelector('#settings').onclick=()=>{document.querySelector('#focusMinutes').value=settings.focus;document.querySelector('#shortMinutes').value=settings.short;document.querySelector('#longMinutes').value=settings.long;dialog.showModal()};
    document.querySelector('#saveSettings').onclick=()=>{settings={focus:Math.max(1,Number(document.querySelector('#focusMinutes').value)||25),short:Math.max(1,Number(document.querySelector('#shortMinutes').value)||5),long:Math.max(1,Number(document.querySelector('#longMinutes').value)||15)};localStorage.setItem('my-life-planner.timer-settings',JSON.stringify(settings));refreshModes();stop();duration=settings[activeKind]*60;remaining=duration;draw()};
    document.addEventListener('visibilitychange',()=>{if(running&&document.visibilityState==='visible'){const elapsed=Math.floor((Date.now()-lastTick)/1000);remaining=Math.max(0,remaining-elapsed);lastTick=Date.now();draw()}});refreshModes();draw();
  </script>
</body>
</html>
