<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf8fd">
  <meta name="darkreader-lock">
  <title>Live clock</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-width: 0;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body { padding: 2px; }

    .clock {
      display: grid;
      width: 100%;
      min-height: 78px;
      padding: 10px 8px;
      place-items: center;
      border: 1px solid #dceaf1;
      border-radius: 12px;
      background:
        radial-gradient(circle at 18% 8%, rgba(255, 255, 255, .96), transparent 42%),
        linear-gradient(145deg, #f5fbfe 0%, #e5f3fa 100%);
      box-shadow: 0 7px 20px rgba(52, 88, 105, .08);
      color: #2b3135;
    }

    .digits {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: center;
      color: #2b3135;
      font-size: clamp(21px, 12vw, 46px);
      font-variant-numeric: tabular-nums;
      font-weight: 740;
      letter-spacing: -.055em;
      line-height: 1;
      white-space: nowrap;
    }

    .separator {
      margin: 0 .08em;
      color: #77909b;
      font-weight: 650;
      transform: translateY(-.06em);
    }

    @media (max-width: 180px) {
      body { padding: 1px; }
      .clock {
        min-height: 68px;
        padding: 8px 4px;
        border-radius: 10px;
      }
      .digits { font-size: 21px; }
      .separator { margin-inline: .03em; }
    }
  </style>
</head>
<body>
  <section class="clock" aria-label="Live local time">
    <time class="digits">
      <span id="hour">--</span><span class="separator" aria-hidden="true">:</span><span id="minute">--</span><span class="separator" aria-hidden="true">:</span><span id="second">--</span>
    </time>
  </section>
  <script>
    const hour = document.querySelector('#hour');
    const minute = document.querySelector('#minute');
    const second = document.querySelector('#second');

    const render = () => {
      const now = new Date();
      hour.textContent = String(now.getHours()).padStart(2, '0');
      minute.textContent = String(now.getMinutes()).padStart(2, '0');
      second.textContent = String(now.getSeconds()).padStart(2, '0');
      document.title = `${hour.textContent}:${minute.textContent}:${second.textContent}`;
    };

    render();
    window.setInterval(render, 250);
  </script>
</body>
</html>
